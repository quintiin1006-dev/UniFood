spring.application.name=unifood-backend

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_AUTH_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# Empty Storage settings keep the existing catalog usable; image uploads return 503.
catalog.images.storage-url=${SUPABASE_STORAGE_URL:}
catalog.images.storage-secret=${SUPABASE_STORAGE_SECRET_KEY:}
catalog.images.bucket=${SUPABASE_PRODUCT_IMAGES_BUCKET:product-images}
catalog.images.connect-timeout-seconds=${PRODUCT_IMAGES_CONNECT_TIMEOUT_SECONDS:5}
catalog.images.operation-timeout-seconds=${PRODUCT_IMAGES_OPERATION_TIMEOUT_SECONDS:20}
catalog.images.cleanup-enabled=${PRODUCT_IMAGES_CLEANUP_ENABLED:true}
spring.servlet.multipart.max-file-size=3145728B
spring.servlet.multipart.max-request-size=3211264B
spring.servlet.multipart.file-size-threshold=0B
