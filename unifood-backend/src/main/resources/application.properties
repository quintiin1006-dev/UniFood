spring.application.name=unifood-backend

# Render injects PORT; local runs keep 8080.
server.port=${PORT:8080}

# Only the liveness/health endpoint is exposed over HTTP. No details, no other endpoints or JMX.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.jmx.exposure.exclude=*

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_AUTH_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# Empty Storage settings keep the existing catalog usable; image uploads return 503.
catalog.images.storage-url=${SUPABASE_STORAGE_URL:}
catalog.images.storage-secret=${SUPABASE_STORAGE_SECRET_KEY:}
catalog.images.bucket=${SUPABASE_PRODUCT_IMAGES_BUCKET:product-images}
catalog.images.connect-timeout-seconds=${PRODUCT_IMAGES_CONNECT_TIMEOUT_SECONDS:5}
catalog.images.operation-timeout-seconds=${PRODUCT_IMAGES_OPERATION_TIMEOUT_SECONDS:20}
catalog.images.cleanup-enabled=${PRODUCT_IMAGES_CLEANUP_ENABLED:true}
# Daily close (B19): at startup and then every interval. Turn it off with DAILY_CLOSE_ENABLED=false.
orders.daily-close.enabled=${DAILY_CLOSE_ENABLED:true}
orders.daily-close.interval=${DAILY_CLOSE_INTERVAL:PT1H}
# Dynamic daily menu (docs/propuesta-menu-dinamico.md). Off by default; nothing reads it yet.
menu.dinamico.enabled=${MENU_DINAMICO_ENABLED:false}
# Service fee per order (docs/modelo-de-negocio.md). Off by default: every order has fee 0.
service.fee.enabled=${SERVICE_FEE_ENABLED:false}
spring.servlet.multipart.max-file-size=3145728B
spring.servlet.multipart.max-request-size=3211264B
spring.servlet.multipart.file-size-threshold=0B
# Push notifications (docs/notificaciones-push.md). Empty VAPID values disable the module; the
# in-app notice keeps working. The private key is a secret: only through the environment.
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:}
push.urgent-ttl-seconds=${PUSH_URGENT_TTL_SECONDS:900}
push.default-ttl-seconds=${PUSH_DEFAULT_TTL_SECONDS:3600}
push.urgent-urgency=${PUSH_URGENT_URGENCY:high}
push.default-urgency=${PUSH_DEFAULT_URGENCY:normal}
