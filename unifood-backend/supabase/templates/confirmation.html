    <title>Verifica tu correo en UniFood</title>

  <body style="font-family: Arial, sans-serif; color: #172b24; line-height: 1.6;">
    <h1>Verifica tu correo en UniFood</h1>
    <p>Ingresa este código de 6 dígitos en la pantalla de verificación para completar tu registro:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>

  </body>
