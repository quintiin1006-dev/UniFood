name: E2E

# No push trigger while the suite has known failures, to avoid a permanent red.
# Restore `push` to develop when issue #30 is sanitized.
# GitHub only runs schedule and workflow_dispatch from the default branch (main).
on:
  schedule:
    - cron: "0 8 * * *" # 03:00 in Bogota
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

# Fake values: the auth and API services are the local test provider.
env:
  API_URL: http://127.0.0.1:3101
  SUPABASE_URL: http://127.0.0.1:3101
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_FAKE_E2E_ONLY_NOT_A_REAL_KEY
  PLAYWRIGHT_PRODUCTION: "true"

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: unifood-web
    steps:
      # Scheduled runs start on main, but the nightly suite must test develop.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: unifood-web/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      # Visual snapshots exist only for Windows.
      - name: Playwright
        run: npx --no-install playwright test --grep-invert 'login-layout\.spec' --reporter=line
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: unifood-web/test-results/
          retention-days: 7
          if-no-files-found: ignore
