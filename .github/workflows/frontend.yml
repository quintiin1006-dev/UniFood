name: Frontend

on:
  pull_request:
    branches: [develop]
    paths:
      - "unifood-web/**"
      - ".nvmrc"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# Fake values: the build only validates their format and nothing is contacted.
env:
  API_URL: http://127.0.0.1:3101
  SUPABASE_URL: http://127.0.0.1:3101
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_FAKE_CI_ONLY_NOT_A_REAL_KEY

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: unifood-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: unifood-web/package-lock.json
      - run: npm ci
      # npm test skips the native tests silently when PostgreSQL is missing.
      - name: Require native PostgreSQL
        run: test -x "$(pg_config --bindir)/initdb"
      # Ubuntu's binaries keep their socket here, closed to the runner user.
      - name: Open PostgreSQL socket directory
        run: sudo chmod 1777 /var/run/postgresql
      - run: npm run lint
      - name: Type check
        run: |
          npx --no-install next typegen
          npx --no-install tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build
      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --relative --name-only --diff-filter=ACMR -z "origin/$BASE_REF...HEAD" -- . \
            | xargs -0 -r npx --no-install prettier --check --ignore-unknown

  # Cash register e2e (tests/e2e/cash.spec.ts) on its own ports with the Spring stand-in of
  # tests/helpers/cash-backend-server.mjs: one worker, Chromium only. Screenshots at 1024×768 and
  # 390 px and the Playwright report are kept as short-lived artifacts.
  e2e-cash:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: unifood-web
    env:
      CASH_SCREENSHOTS: ${{ github.workspace }}/unifood-web/cash-screenshots
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: unifood-web/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - name: Cash e2e
        run: npx --no-install playwright test -c playwright.cash.config.ts --reporter=line,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-cash-screenshots
          path: unifood-web/cash-screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-cash-report
          path: |
            unifood-web/playwright-report/
            unifood-web/test-results/
          retention-days: 7
          if-no-files-found: ignore
